# Robolectric 4.12.1 ships Android framework jars up to SDK 34. The module targets SDK 36, so
# without pinning, Robolectric refuses to start with
# "Package targetSdkVersion=36 > maxSdk" and every @RunWith(RobolectricTestRunner) class fails
# as initializationError. Raise or drop this once Robolectric is upgraded.
sdk=34
