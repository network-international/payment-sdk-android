apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group='com.github.network-international'

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Propagate the Samsung Pay SDK keep rules to any app that consumes this module. Without
        // this, an app built with minifyEnabled=true (e.g. the demoRelease variant) obfuscates the
        // bundled Samsung SDK Parcelable classes, breaking Binder IPC to the Samsung Pay service
        // with "BadParcelableException: ClassNotFoundException" → REMOTE_EXCEPTION
        // (-103 ERROR_INITIATION_FAIL).
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // TODO add lint rules, and fix lint errors
    lintOptions {
        quiet true
        abortOnError false
        warningsAsErrors true
    }
    namespace 'payment.sdk.android.samsungpay'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':payment-sdk-core')

    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"

    testImplementation "junit:junit:$junit"
    api files('libs/samsungpay_2.22.00.jar')
}
repositories {
    mavenCentral()
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.network-international'
            artifactId = 'payment-sdk-samsungpay'
            version = '0.0.0'

            afterEvaluate {
                from components.release
            }
        }
    }
}