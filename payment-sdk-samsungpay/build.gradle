apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group='com.github.network-international'

android {
    compileSdk 35

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Ship the Samsung Pay keep rules to any app that consumes this library,
        // so the app's R8/minify pass does not obfuscate com.samsung.android.sdk.**
        // (obfuscation breaks Parcelable unmarshalling and fails with REMOTE_EXCEPTION -103).
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // TODO add lint rules, and fix lint errors
    lint {
        quiet true
        abortOnError false
        warningsAsErrors true
    }
    namespace 'payment.sdk.android.samsungpay'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':payment-sdk-core')

    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"

    testImplementation "junit:junit:$junit"
    api files('libs/samsungpay_2.22.00.jar')
}
repositories {
    mavenCentral()
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.network-international'
            artifactId = 'payment-sdk-samsungpay'
            version = '0.0.0'

            afterEvaluate {
                from components.release
            }
        }
    }
}